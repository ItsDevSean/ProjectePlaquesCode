<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Altura de Fachada</title>
    <script async src="https://docs.opencv.org/3.4/opencv.js"></script>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #imageInput {
            margin-top: 20px;
        }
        #canvasOutput {
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calcular Altura de Fachada</h1>
        <input type="file" id="imageInput" accept="image/*">
        <canvas id="canvasOutput"></canvas>
        <div id="statusMessage"></div>
    </div>

    <script>
        let cvReady = false;
        let points = [];

        // Función para manejar la carga de OpenCV.js
        function openCvLoaded() {
            cvReady = true;
            document.querySelector("h1").textContent = "OpenCV.js cargado con éxito!";
            console.log("OpenCV.js cargado y listo");
        }

        // Función para procesar la imagen
        function processImage(imgElement) {
            const canvas = document.getElementById('canvasOutput');
            const ctx = canvas.getContext('2d');

            // Establecer las dimensiones del canvas según la imagen
            canvas.width = imgElement.width;
            canvas.height = imgElement.height;

            // Dibujar la imagen en el canvas
            ctx.drawImage(imgElement, 0, 0);

            // Procesar la imagen con OpenCV.js
            const src = cv.imread(canvas);
            const dst = new cv.Mat();

            // Convertir la imagen a escala de grises
            cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);

            // Detectar bordes con Canny
            cv.Canny(src, dst, 50, 100);

            // Mostrar la imagen procesada
            cv.imshow(canvas, dst);

            // Liberar las matrices
            src.delete();
            dst.delete();

            // Mostrar mensaje de éxito
            document.getElementById("statusMessage").innerText = "Imagen procesada con éxito!";
        }

        // Función para manejar el archivo de imagen cargado
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgElement = new Image();
                    imgElement.onload = function() {
                        processImage(imgElement);
                    };
                    imgElement.src = e.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                alert('Por favor selecciona una imagen válida');
            }
        }

        // Asignar el evento de carga de imagen
        document.getElementById('imageInput').addEventListener('change', handleImageUpload);

        // Función para calcular la altura de la fachada
        function calculateFacadeHeight() {
            if (points.length < 2) {
                alert("Necesitas seleccionar dos puntos de referencia.");
                return;
            }

            // Obtener la distancia en píxeles entre los puntos seleccionados
            const pixelDistance = Math.sqrt(Math.pow(points[1].x - points[0].x, 2) + Math.pow(points[1].y - points[0].y, 2));
            console.log("Distancia en píxeles entre los puntos seleccionados: ", pixelDistance);

            // Establecer la altura de referencia (esto debe ser algo conocido, como la altura de una persona, por ejemplo)
            const referenceHeight = 1.7; // Establecer la altura de referencia (en metros, por ejemplo)

            // Establecer la distancia entre los puntos en la foto en píxeles y usarla para calcular la escala
            const scale = referenceHeight / pixelDistance;
            console.log("Escala calculada: ", scale);

            // Medir la altura de la fachada (esto se hace con los puntos de la fachada)
            // Por ejemplo, si tienes puntos de la fachada, los puedes medir de manera similar.
            // Para este ejemplo, imagina que tienes la distancia vertical de la fachada en píxeles:
            const facadePixelHeight = 300; // Medido en píxeles, por ejemplo
            console.log("Distancia vertical de la fachada en píxeles: ", facadePixelHeight);

            // Calcular la altura de la fachada en metros
            const facadeHeight = facadePixelHeight * scale;
            console.log("Altura de la fachada calculada: ", facadeHeight);

            alert("La altura de la fachada es " + facadeHeight.toFixed(2) + " metros.");
        }

        // Función para manejar el clic en el canvas y seleccionar puntos
        function handleCanvasClick(event) {
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // Almacenar los puntos seleccionados
            if (points.length < 2) {
                points.push({ x, y });

                // Dibujar un círculo en el punto seleccionado
                const canvas = document.getElementById('canvasOutput');
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2, false);
                ctx.fillStyle = 'red';
                ctx.fill();

                // Si ya hay dos puntos, calcular la altura de la fachada
                if (points.length == 2) {
                    calculateFacadeHeight();
                }
            }
        }

        // Asignar el evento de clic al canvas para seleccionar puntos
        document.getElementById('canvasOutput').addEventListener('click', handleCanvasClick);

        // Iniciar la carga de OpenCV.js
        window.onload = function() {
            // Verificar si OpenCV.js está listo
            if (typeof cv !== 'undefined') {
                openCvLoaded();
            }
        };
    </script>
</body>
</html>
